<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0d1f14">
<title>Santa Luzia Bets ⚽</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body>
<div class="page-center">
  <div class="auth-card">
    <div class="auth-logo">⚽ <span>SANTA LUZIA</span> BETS</div>
    <div class="auth-sub" id="auth-sub"></div>

    <button class="google-btn" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Entrar com Google
    </button>

    <div class="auth-divider">ou</div>
    <div id="err-msg" class="err-msg"></div>
    <div id="ok-msg"  class="ok-msg"></div>

    <div id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="o.teu@email.com" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginEmail()"></div>
      <button class="btn-primary" onclick="loginEmail()" style="margin-top:.5rem">Entrar</button>
      <div class="auth-toggle">Não tens conta? <a onclick="toggleForm('register')">Regista-te</a></div>
    </div>

    <div id="register-form" style="display:none">
      <div class="form-group"><label>Nome</label><input type="text" id="reg-name" placeholder="O teu nome" autocomplete="name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="o.teu@email.com" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><input type="password" id="reg-pass" placeholder="mínimo 6 caracteres" autocomplete="new-password"></div>
      <button class="btn-primary" onclick="registerEmail()" style="margin-top:.5rem">Criar Conta</button>
      <div class="auth-toggle">Já tens conta? <a onclick="toggleForm('login')">Entrar</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shared.js"></script>
<script>
// O Supabase processa o token OAuth do URL hash automaticamente.
// Usamos onAuthStateChange como fonte única de verdade.
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    window.location.replace('lobby.html');
  }
});

// Verificar sessão já existente (ex: utilizador volta à página de login)
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.replace('lobby.html');
})();

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/lobby.html',
      skipBrowserRedirect: false,
    }
  });
  if (error) showErr(error.message);
}

async function loginEmail() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) return showErr('Preenche email e password.');
  clearMsgs();
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) showErr('Email ou password incorretos.');
}

async function registerEmail() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  if (!name || !email || !pass) return showErr('Preenche todos os campos.');
  if (pass.length < 6) return showErr('Password com mínimo 6 caracteres.');
  clearMsgs();
  const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
  if (error) showErr(error.message);
  else showOk('Conta criada! Verifica o email ou entra já.');
}

function toggleForm(mode) {
  clearMsgs();
  document.getElementById('login-form').style.display    = mode==='login'    ? 'block' : 'none';
  document.getElementById('register-form').style.display = mode==='register' ? 'block' : 'none';
}
function showErr(msg) { const e=document.getElementById('err-msg'); e.textContent=msg; e.classList.add('show'); }
function showOk(msg)  { const e=document.getElementById('ok-msg');  e.textContent=msg; e.classList.add('show'); }
function clearMsgs()  { ['err-msg','ok-msg'].forEach(id=>document.getElementById(id).classList.remove('show')); }

// Apply translations
function applyTranslations() {
  const q  = s => document.querySelector(s);
  const qa = s => document.querySelectorAll(s);

  // Subtitle
  const sub = document.getElementById('auth-sub');
  if (sub) sub.textContent = t('auth_sub');

  // Google button text node
  const gBtn = q('.google-btn');
  if (gBtn) {
    const textNode = [...gBtn.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
    if (textNode) textNode.textContent = ' ' + t('auth_google');
  }

  // Divider
  const div = q('.auth-divider');
  if (div) div.textContent = t('auth_or');

  // Labels
  const labels = {
    'label[for="login-email"], #login-form label:first-of-type': 'auth_email',
  };
  qa('#login-form label').forEach((el, i) => {
    el.textContent = i === 0 ? t('auth_email') : t('auth_password');
  });
  qa('#register-form label').forEach((el, i) => {
    const keys = ['auth_name', 'auth_email', 'auth_password'];
    if (keys[i]) el.textContent = t(keys[i]);
  });

  // Placeholders
  const lpass = document.getElementById('login-pass');
  if (lpass) lpass.placeholder = '••••••••';

  const rpass = document.getElementById('reg-pass');
  if (rpass) rpass.placeholder = t('auth_min_pass');

  // Email placeholders
  const lemail = document.getElementById('login-email');
  if (lemail) lemail.placeholder = t('auth_email_ph') || 'o.teu@email.com';
  const remail = document.getElementById('reg-email');
  if (remail) remail.placeholder = t('auth_email_ph') || 'o.teu@email.com';
  const rname = document.getElementById('reg-name');
  if (rname) rname.placeholder = t('auth_name_ph') || t('auth_name');

  // Buttons
  const loginBtn = q('#login-form .btn-primary');
  if (loginBtn) loginBtn.textContent = t('auth_enter');

  const regBtn = q('#register-form .btn-primary');
  if (regBtn) regBtn.textContent = t('auth_create');

  // Toggle links
  const loginToggle = q('#login-form .auth-toggle');
  if (loginToggle) loginToggle.innerHTML = `${t('auth_no_account')} <a onclick="toggleForm('register')">${t('auth_register')}</a>`;

  const regToggle = q('#register-form .auth-toggle');
  if (regToggle) regToggle.innerHTML = `${t('auth_has_account')} <a onclick="toggleForm('login')">${t('auth_login')}</a>`;
}
applyTranslations();
</script>
</body>
</html>
